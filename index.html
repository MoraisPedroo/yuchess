<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess-Gi-Oh! Cartoon Edition</title>
  <meta name="description" content="Xadrez a sério com cartas ao estilo Yu-Gi-Oh!: equipamentos, armadilhas escondidas no tabuleiro, escudos e counter-traps. Contra o bot ou online com ranking.">
  <meta name="theme-color" content="#0F141C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 3 fontes (docs/DIRECAO-DE-ARTE.md): Titan One (títulos), Plus Jakarta Sans (interface e cartas), Chakra Petch (números) -->
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <!-- Three.js 0.160.0 (palco 3D) por importmap, sem build -->
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module" async src="src/view3d/three-bridge.js"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/board.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/match.css">
  <link rel="stylesheet" href="styles/arena.css">
  <link rel="stylesheet" href="styles/hub.css">
  <link rel="stylesheet" href="styles/gacha.css">
  <link rel="stylesheet" href="styles/ultimate.css">
  <link rel="stylesheet" href="styles/play.css">
</head>
<body>
  <header id="topnav">
    <div class="account" title="Conta e online"></div>
    <div class="logo" title="Início">Chess-Gi-Oh!<small>Cartoon Edition</small></div>
    <div class="match-flag" data-icon="swords">Partida em curso</div>
    <div class="wallet"></div>
    <button id="btn-mute" class="icon-btn" title="Som"></button>
    <button id="btn-settings" class="icon-btn" title="Definições"></button>
  </header>
  <!-- navegação em doca, em baixo (estilo Supercell): o separador ativo fica mais largo e mais alto -->
  <nav id="dock" aria-label="Secções">
    <button class="tab" data-tab="shop" data-icon="chest"><span>Loja</span></button>
    <button class="tab" data-tab="decks" data-icon="cards"><span>Baralhos</span></button>
    <button class="tab" data-tab="arena" data-icon="rook"><span>Arena</span></button>
  </nav>

  <main id="screens">
    <section id="screen-arena" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-decks" class="screen"></section>
    <section id="screen-match" class="screen screen-match"></section>
  </main>
  <div id="toasts"></div>

  <!-- Animação (GSAP) e confetes: se o CDN falhar, o jogo continua sem estas animações. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
