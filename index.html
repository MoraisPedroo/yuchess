<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess-Gi-Oh! Cartoon Edition</title>
  <meta name="description" content="Xadrez a sério com cartas ao estilo Yu-Gi-Oh!: equipamentos, armadilhas escondidas no tabuleiro, escudos e counter-traps. Contra o bot ou online com ranking.">
  <meta name="theme-color" content="#2D1B4E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Chakra+Petch:wght@600;700&family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&family=Orbitron:wght@700;900&family=Spectral:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Three.js 0.160.0 (palco 3D) por importmap, sem build -->
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module" async src="src/view3d/three-bridge.js"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/board.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/match.css">
  <link rel="stylesheet" href="styles/arena.css">
  <link rel="stylesheet" href="styles/hub.css">
</head>
<body>
  <header id="topnav">
    <div class="logo" title="Início">Chess<span>-Gi-</span>Oh!<small>CARTOON EDITION</small></div>
    <nav class="tabs" aria-label="Secções">
      <button class="tab" data-tab="arena">Arena</button>
      <button class="tab" data-tab="shop">Loja</button>
      <button class="tab" data-tab="decks">Baralhos</button>
      <button class="tab" data-tab="online">Online</button>
    </nav>
    <div class="match-flag">⚔ Partida em curso</div>
    <div class="wallet"></div>
    <button id="btn-mute" class="chip dark" title="Som">🔊</button>
    <div class="account" title="Conta e online"></div>
  </header>

  <main id="screens">
    <section id="screen-arena" class="screen"></section>
    <section id="screen-shop" class="screen"></section>
    <section id="screen-decks" class="screen"></section>
    <section id="screen-online" class="screen"></section>
    <section id="screen-match" class="screen screen-match"></section>
  </main>
  <div id="toasts"></div>

  <!-- Animação (GSAP) e confetes: se o CDN falhar, o jogo continua sem estas animações. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script src="src/core/EventBus.js"></script>
  <script src="src/game/ChessRules.js"></script>
  <script src="src/game/Cards.js"></script>
  <script src="src/game/CardEffects.js"></script>
  <script src="src/game/ChainResolver.js"></script>
  <script src="src/game/MoveResolver.js"></script>
  <script src="src/game/MatchController.js"></script>
  <script src="src/game/MatchEffects.js"></script>
  <script src="src/game/BotAI.js"></script>
  <script src="src/game/Economy.js"></script>
  <script src="src/net/firebase-config.js"></script>
  <script src="src/net/FirebaseClient.js"></script>
  <script src="src/net/ProfileStore.js"></script>
  <script src="src/net/LockstepSession.js"></script>
  <script src="src/net/OnlineService.js"></script>
  <script src="src/net/Ranking.js"></script>
  <script src="src/net/OnlineGame.js"></script>
  <script src="src/audio/SoundEngine.js"></script>
  <script src="src/view/PieceArt.js"></script>
  <script src="src/view/CardArt.js"></script>
  <script src="src/view/Assets.js"></script>
  <script src="src/view/FX.js"></script>
  <script src="src/view/BoardView.js"></script>
  <script src="src/view/MatchAnimator.js"></script>
  <script src="src/view/PieceAnimations.js"></script>
  <script src="src/view3d/Toon3D.js"></script>
  <script src="src/view3d/PieceMeshes.js"></script>
  <script src="src/view3d/Board3D.js"></script>
  <script src="src/view3d/Board3DScene.js"></script>
  <script src="src/view3d/Board3DSync.js"></script>
  <script src="src/view3d/FxArtList.js"></script>
  <script src="src/view3d/Particles3D.js"></script>
  <script src="src/view3d/Portraits3D.js"></script>
  <script src="src/view3d/Anim3D.js"></script>
  <script src="src/view3d/Anim3DCards.js"></script>
  <script src="src/ui/UIKit.js"></script>
  <script src="src/ui/HoloCard.js"></script>
  <script src="src/ui/ItemArtList.js"></script>
  <script src="src/ui/ItemToken.js"></script>
  <script src="src/ui/MatchUI.js"></script>
  <script src="src/ui/MatchInput.js"></script>
  <script src="src/ui/MatchDrag.js"></script>
  <script src="src/ui/MatchHUD.js"></script>
  <script src="src/ui/MatchChain.js"></script>
  <script src="src/ui/CardZoom.js"></script>
  <script src="src/ui/PieceInspector.js"></script>
  <script src="src/ui/Hub.js"></script>
  <script src="src/ui/GachaView.js"></script>
  <script src="src/ui/DeckBuilderView.js"></script>
  <script src="src/ui/OnlineLobby.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
