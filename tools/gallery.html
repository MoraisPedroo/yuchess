<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria de peças e cartas</title>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya:wght@400;700;800&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/cards.css">
  <style>
    html, body { overflow: auto; background: #3b2a1e; }
    .row { display: flex; gap: 10px; padding: 10px; flex-wrap: wrap; }
    .tile { width: 150px; height: 190px; background: #F4E7C5; border: 3px solid #141210; border-radius: 8px; position: relative; }
    .tile.dark { background: repeating-linear-gradient(45deg, #6E4B33 0 5px, #5d3f2b 5px 7px); }
    .tile svg { position: absolute; left: 5%; bottom: 4%; width: 90%; }
    .cards { display: flex; gap: 10px; padding: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="row" id="white"></div>
  <div class="row" id="black"></div>
  <div class="cards" id="cards"></div>
  <script src="../src/core/EventBus.js"></script>
  <script src="../src/data/CardDatabase.js"></script>
  <script src="../src/view/PieceFactory.js"></script>
  <script src="../src/view/VFXPostProcessor.js"></script>
  <script src="../src/ui/CardView.js"></script>
  <script>
    const vfx = new YC.VFXPostProcessor(); vfx.mount(); vfx.setFilm(false);
    const anim = new YC.PieceFactory.IdleAnimator();
    vfx.onTick(() => anim.tick());
    for (const team of ['WHITE', 'BLACK']) {
      ['PAWN', 'KNIGHT', 'BISHOP', 'ROOK', 'QUEEN', 'KING'].forEach((type, i) => {
        const t = document.createElement('div');
        t.className = 'tile' + ((i + (team === 'BLACK' ? 1 : 0)) % 2 ? ' dark' : '');
        const rig = YC.PieceFactory.createPieceSVG(type, team);
        t.appendChild(rig.svg); anim.add(rig);
        document.getElementById(team.toLowerCase()).appendChild(t);
      });
    }
    const seen = new Set();
    for (const c of YC.CardDatabase.buildDeck()) {
      if (seen.has(c.defId) || (c.basic && seen.size > 30)) continue;
      seen.add(c.defId);
      document.getElementById('cards').appendChild(YC.CardView.create(c));
    }
    document.getElementById('cards').appendChild(YC.CardView.createBack());
  </script>
</body>
</html>
